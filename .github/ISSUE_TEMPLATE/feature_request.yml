name: Feature / Balance Request (功能与平衡建议)
description: 提交新英雄、新武器、新血契或难度平衡调整想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 建议分类
      options:
        - 新武器 / 四阶红武觉醒路线
        - 新血契 / 商店道具
        - 新英雄 / 深渊圣所天赋
        - 移动端触控或 UI 体验优化
        - 数值平衡性调整
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 详细设计与动机
      description: 描述玩法机制、数值正负权衡，以及为什么这会让战斗/构筑更有趣。
    validations:
      required: true
