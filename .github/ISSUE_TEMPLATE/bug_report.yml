name: Bug Report (缺陷反馈)
description: 报告《血契竞技场》在手机端或桌面端遇到的 Bug、闪退或数值异常
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈！请提供以下信息以便快速定位问题。
  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - Android 真机 (APK)
        - Android 模拟器
        - Windows 桌面端
        - Godot 编辑器运行
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备型号 / 系统版本 / 屏幕分辨率
      placeholder: 例如：小米 14 / Android 15 / 1200x2670
  - type: textarea
    id: description
    attributes:
      label: 问题现象
      description: 清晰描述实际发生了什么，以及期望的正确表现。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 例如：选择英雄 -> 第 X 波 -> 签署某血契 -> 合成四阶红武时触发
      value: |
        1. 选择英雄：
        2. 游玩到第几波：
        3. 操作步骤：
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 报错日志或截图（可选）
      description: 如有 adb logcat 或 Godot 控制台错误日志，请粘贴在下方。
